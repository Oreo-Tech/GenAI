version: 0.1
component: build
timeoutInSeconds: 6000
runAs: root
shell: bash
env:
  # these are local variables to the build config
  variables:
    key: "value"

  # the value of a vaultVariable is the secret-id (in OCI ID format) stored in the OCI Vault service
  # you can then access the value of that secret in your build_spec.yaml commands
  vaultVariables:
  #  EXAMPLE_SECRET: "YOUR-SECRET-OCID"
  
  # exportedVariables are made available to use as parameters in sucessor Build Pipeline stages
  # For this Build to run, the Build Pipeline needs to have a BUILDRUN_HASH parameter set
  exportedVariables:
    - BUILDRUN_HASH

steps:
  - type: Command
    name: "Define unique image tag"
    timeoutInSeconds: 40
    command: |
      export BUILDRUN_HASH=`echo ${OCI_BUILD_RUN_ID} | rev | cut -c 1-7`
      echo "BUILDRUN_HASH: " $BUILDRUN_HASH

  - type: Command
    timeoutInSeconds: 600
    name: "Install Python Prereqs"
    command: |
      sudo yum install -y python3.12.2
      python3.12 --version
    onFailure:
      - type: Command
        command: |
          echo "Handling Failure"
          echo "Failure successfully handled"
        timeoutInSeconds: 40
        runAs: root
  
  - type: Command
    timeoutInSeconds: 600
    name: "Build Venv"
    command: |
      cd ${OCI_WORKSPACE_DIR}/application
      echo "python VERSION: $(python3.12 --version)"
      sudo /usr/local/bin/python3.12 -m ensurepip --upgrade
      sudo /usr/local/bin/python3.12 -m pip install --upgrade pip
      sudo ln -s /usr/local/bin/python3.12 /usr/bin/python3.12
      sudo ln -s /usr/local/bin/pip3.12 /usr/bin/pip3.12
      python3 -m venv .venv
      source .venv/bin/activate
      pip3.12 install "oci[adk]"
    onFailure:
      - type: Command
        command: |
          echo "Handling Failure"
          echo "Failure successfully handled"
        timeoutInSeconds: 40
        runAs: root

  - type: Command
    timeoutInSeconds: 1200
    name: "Agent Setup"
    command: |
      cd ${OCI_WORKSPACE_DIR}/application
      python agent.py
